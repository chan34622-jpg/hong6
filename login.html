<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 로그인 | 홍익기술사사무소</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['"Noto Sans KR"', 'sans-serif'],
          display: ['"Space Grotesk"', '"Noto Sans KR"', 'sans-serif'],
        },
        colors: {
          navy: { 50: '#eef3fb', 500: '#0a4da2', 600: '#0a4592', 700: '#073a7d', 900: '#041f42' },
          sunset: { 500: '#f28c00', 600: '#d97900' },
          steel: { 50: '#fafafa', 100: '#f2f2f3', 200: '#e4e5e6', 300: '#d2d3d5', 400: '#b5b6b9', 500: '#94969a', 600: '#75777b' },
        },
      },
    },
  };
</script>
<style>
  body { background-color: #ffffff; color: #26282b; }
</style>
</head>

<body class="antialiased min-h-screen flex flex-col">

<header class="border-b border-steel-200 bg-white">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 h-18 flex items-center justify-between py-4">
    <a href="index.html" class="flex items-center">
      <img src="assets/logo.png" alt="홍익기술사사무소" class="h-16 w-auto" />
    </a>
    <a href="index.html" class="text-sm text-steel-600 hover:text-navy-700 transition-colors">← 홈으로</a>
  </div>
</header>

<main class="flex-1 flex items-center justify-center px-6 py-20">
  <div class="w-full max-w-sm">
    <h1 class="font-display font-bold text-2xl text-navy-900 text-center">관리자 로그인</h1>
    <p class="mt-2 text-sm text-steel-500 text-center">비공개 상담신청 확인 및 게시판 관리를 위한 관리자 전용 페이지입니다.</p>

    <form id="loginForm" class="mt-10 space-y-4">
      <div>
        <label class="text-xs text-steel-500">관리자 아이디</label>
        <input id="username" type="text" required placeholder="아이디를 입력하세요" autocomplete="username"
          class="mt-1.5 w-full rounded-lg bg-white border border-steel-300 focus:border-navy-500 focus:ring-1 focus:ring-navy-500 outline-none px-4 py-3 text-sm text-navy-900 placeholder-steel-400" />
      </div>
      <div>
        <label class="text-xs text-steel-500">비밀번호</label>
        <input id="password" type="password" required placeholder="비밀번호를 입력하세요" autocomplete="current-password"
          class="mt-1.5 w-full rounded-lg bg-white border border-steel-300 focus:border-navy-500 focus:ring-1 focus:ring-navy-500 outline-none px-4 py-3 text-sm text-navy-900 placeholder-steel-400" />
      </div>

      <p id="errorMsg" class="hidden text-xs text-red-500"></p>

      <button type="submit" class="w-full rounded-full bg-sunset-500 hover:bg-sunset-600 transition-all px-8 py-3.5 text-sm font-semibold text-white">
        로그인
      </button>
    </form>

    <p class="mt-6 text-xs text-steel-400 text-center leading-relaxed">
      일반 방문자는 로그인 없이 게시판과 상담 신청을 이용할 수 있습니다.<br />이 페이지는 사무소 관리자 전용입니다.
    </p>
  </div>
</main>

<footer class="py-6 text-center text-xs text-steel-400 border-t border-steel-200">
  © 2026 홍익기술사사무소
</footer>

<script src="js/store.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const redirectTo = params.get('redirect') || 'index.html';

  if (STORE.isAdmin()) {
    location.href = redirectTo;
  }

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('errorMsg');

    if (STORE.adminLogin(username, password)) {
      location.href = redirectTo;
    } else {
      errorMsg.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
      errorMsg.classList.remove('hidden');
    }
  });
</script>

</body>
</html>
